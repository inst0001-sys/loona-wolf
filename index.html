
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loona Wolf | Official Fanbase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🐺 LOONA WOLF</h1>
    <p>Welcome to the Wolf Pack</p>
  </header>

  <main>
    <section class="sidebar">
      <h2>🌙 Wolf Pack</h2>

      <div class="members">
        <h3>MEMBERS</h3>
        <div id="member-count">19</div>
        <p id="next-milestone"></p>

        <div class="milestone-track">
          <div id="milestone-progress"></div>
        </div>
      </div>

      <a href="https://www.chess.com/"
         class="join-button">
        JOIN THE WOLF PACK
        <span>Join our Chess.com community 🐺</span>
      </a>
    </section>

    <section class="content">
      <h2>Welcome, Wolf!</h2>
      <p>
        A community built on friendship,
        chess, and the spirit of the Wolf Pack.
      </p>

      <h2>♟️ Chess Corner</h2>
      <iframe
        src="https://www.chess.com/"
        title="Chess.com"
        width="100%"
        height="400">
      </iframe>
    </section>
  </main>

  <footer>
    <p>© 2026 Loona Wolf | Stay Wild 🐺</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
